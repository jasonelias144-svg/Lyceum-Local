<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lyceum's icon is an eclipse; Local's is a small light of its own, kept inside a ring. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0a0a"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="256" cy="256" r="36" fill="#ffffff"/>
</svg>
